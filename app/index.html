<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Relay</title><style>body{margin:0;background:#080914;color:#fff;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.c{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#765cff;color:#fff;border:0;border-radius:10px;padding:12px}textarea{width:100%;height:120px;box-sizing:border-box;background:#080b18;color:#fff;border:1px solid #394060;border-radius:10px;padding:12px}</style></head><body><main><h1>Codex Relay</h1><p>Standalone relay control panel</p><div class="c"><h2>Request</h2><textarea id="q" placeholder="Relay-Anfrage…"></textarea><button onclick="go()">Validieren</button><p id="o">Bereit.</p></div><div class="c"><h2>Safety</h2><p>Requests are validated before being passed to any configured backend.</p></div></main><script>function go(){const q=document.getElementById('q').value.trim();document.getElementById('o').textContent=q?'Anfrage lokal validiert.':'Bitte eine Anfrage eingeben.'}</script></body></html>
